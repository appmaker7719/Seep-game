name: Build Seep APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip and Move Files
      run: |
        unzip -o Seep_2_4_Player_App.zip
        # अगर अनज़िप होने पर कोई सब-फ़ोल्डर बना है, तो फ़ाइलों को बाहर निकालें
        PROJECT_DIR=$(find . -maxdepth 2 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
        echo "Found project at: $PROJECT_DIR"
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: |
        cd "$PROJECT_DIR"
        if [ -f gradlew ]; then chmod +x gradlew; fi

    - name: Build APK
      run: |
        cd "$PROJECT_DIR"
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: seep-game-apk
        path: "**/build/outputs/apk/debug/*.apk"
