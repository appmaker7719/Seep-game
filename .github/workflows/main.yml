name: Build Seep APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project files
      run: |
        unzip -o Seep_2_4_Player_App.zip

    - name: Grant execute permission for gradlew
      run: |
        if [ -f gradlew ]; then chmod +x gradlew; fi
        if [ -d */gradlew ]; then chmod +x */gradlew; fi

    - name: Build APK
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug
        elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
          gradle assembleDebug
        else
          # अगर ज़िप फ़ोल्डर के अंदर फ़ाइलें हैं
          SUBDIR=$(find . -maxdepth 2 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          cd "$SUBDIR"
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug; else gradle assembleDebug; fi
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: seep-game-apk
        path: "**/build/outputs/apk/debug/*.apk"
